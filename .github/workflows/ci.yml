# Repo verification: the checks on three OSes, then the Compose_Acceptance_Check (Phase 1.2).
# No secrets are used by any job; the acceptance check makes its own per-run DEVICE_TOKEN.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: git diff --exit-code pnpm-lock.yaml

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

  compose:
    name: compose acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Config resolves with no .env
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          docker compose config --quiet

      - name: Every Panel_Key reaches gateway and simulator (Req 10.6)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cp .env.example .env
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          node -e '
            const fs = require("node:fs");
            const keys = fs
              .readFileSync("tooling/fixtures/approved-panel.txt", "utf8")
              .split(/\r?\n/)
              .map((line) => /^([A-Za-z_][A-Za-z0-9_]*)=/.exec(line))
              .filter(Boolean)
              .map((m) => m[1]);
            if (keys.length === 0) throw new Error("no Panel_Keys found in the fixture");
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            let failed = false;
            for (const svc of ["gateway", "simulator"]) {
              const env = config.services?.[svc]?.environment ?? {};
              const missing = keys.filter((k) => !Object.hasOwn(env, k));
              if (missing.length > 0) {
                failed = true;
                console.error(`${svc} is missing: ${missing.join(", ")}`);
              }
            }
            if (failed) process.exit(1);
            console.log(`all ${keys.length} Panel_Keys present in gateway and simulator`);
          ' "$RUNNER_TEMP/compose.json"
          rm -f "$RUNNER_TEMP/compose.json"

      - name: Build gateway and simulator images
        run: docker compose build gateway simulator

      - name: Start EMQX with no .env
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          docker compose up -d emqx

      - name: EMQX dashboard answers within 120 s
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -fsS -o /dev/null http://127.0.0.1:18083; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "EMQX dashboard did not answer within 120 s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: EMQX ports listen on 127.0.0.1 only
        shell: bash
        run: |
          set -euo pipefail
          for port in 1883 8883 8083 8084 18083; do
            addrs=$(ss -ltnH "sport = :$port" | awk '{print $4}')
            if [ -z "$addrs" ]; then
              echo "nothing listens on port $port" >&2
              exit 1
            fi
            if printf '%s\n' "$addrs" | grep -vxF "127.0.0.1:$port"; then
              echo "port $port listens beyond 127.0.0.1" >&2
              exit 1
            fi
          done

      # Writes a temporary Local_Mode .env, runs Req 23.1–23.8 against the whole stack, then
      # stops the stack and deletes the .env itself.
      - name: Compose_Acceptance_Check (Done-when 1–6)
        timeout-minutes: 12
        run: node tooling/compose/compose-acceptance.ts

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v

      - name: Remove temporary .env
        if: always()
        run: rm -f .env
