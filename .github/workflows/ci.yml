# Phase 0 verification. No secrets are used by any job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: git diff --exit-code pnpm-lock.yaml

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm start:gateway

      - run: pnpm start:simulator

  compose:
    name: compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Config resolves with no .env
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          docker compose config --quiet

      - name: Every Panel_Key reaches gateway and simulator (Req 10.6)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cp .env.example .env
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          node -e '
            const fs = require("node:fs");
            const keys = fs
              .readFileSync("tooling/fixtures/approved-panel.txt", "utf8")
              .split(/\r?\n/)
              .map((line) => /^([A-Za-z_][A-Za-z0-9_]*)=/.exec(line))
              .filter(Boolean)
              .map((m) => m[1]);
            if (keys.length === 0) throw new Error("no Panel_Keys found in the fixture");
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            let failed = false;
            for (const svc of ["gateway", "simulator"]) {
              const env = config.services?.[svc]?.environment ?? {};
              const missing = keys.filter((k) => !Object.hasOwn(env, k));
              if (missing.length > 0) {
                failed = true;
                console.error(`${svc} is missing: ${missing.join(", ")}`);
              }
            }
            if (failed) process.exit(1);
            console.log(`all ${keys.length} Panel_Keys present in gateway and simulator`);
          ' "$RUNNER_TEMP/compose.json"
          rm -f "$RUNNER_TEMP/compose.json"

      - name: Compose up
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          docker compose up -d --build

      - name: EMQX dashboard answers within 120 s
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -fsS -o /dev/null http://127.0.0.1:18083; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "EMQX dashboard did not answer within 120 s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Gateway and simulator print ok and exit 0 within 60 s
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          for svc in gateway simulator; do
            id=$(docker compose ps -a -q "$svc")
            test -n "$id"
            until [ "$(docker inspect -f '{{.State.Status}}' "$id")" = "exited" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$svc did not exit within 60 s" >&2
                exit 1
              fi
              sleep 1
            done
            docker logs "$id" > "$RUNNER_TEMP/$svc.out" 2> "$RUNNER_TEMP/$svc.err"
            printf 'ok\n' | cmp -s - "$RUNNER_TEMP/$svc.out" || { echo "$svc stdout is not exactly ok" >&2; exit 1; }
            test ! -s "$RUNNER_TEMP/$svc.err" || { echo "$svc wrote to stderr" >&2; exit 1; }
            rm -f "$RUNNER_TEMP/$svc.out" "$RUNNER_TEMP/$svc.err"
            test "$(docker inspect -f '{{.State.ExitCode}}' "$id")" = "0"
            test "$(docker inspect -f '{{.RestartCount}}' "$id")" = "0"
          done

      - name: After 30 s, both are still exited and EMQX is still running
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          for svc in gateway simulator; do
            id=$(docker compose ps -a -q "$svc")
            test "$(docker inspect -f '{{.State.Status}}' "$id")" = "exited"
            test "$(docker inspect -f '{{.RestartCount}}' "$id")" = "0"
          done
          emqx=$(docker compose ps -a -q emqx)
          test "$(docker inspect -f '{{.State.Status}}' "$emqx")" = "running"

      - name: EMQX ports listen on 127.0.0.1 only
        shell: bash
        run: |
          set -euo pipefail
          for port in 1883 8883 8083 8084 18083; do
            addrs=$(ss -ltnH "sport = :$port" | awk '{print $4}')
            if [ -z "$addrs" ]; then
              echo "nothing listens on port $port" >&2
              exit 1
            fi
            if printf '%s\n' "$addrs" | grep -vxF "127.0.0.1:$port"; then
              echo "port $port listens beyond 127.0.0.1" >&2
              exit 1
            fi
          done

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v
